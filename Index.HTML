<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Super Hero Card</title>
    <link rel="stylesheet" href="Style.CSS">
</head>
<body>
    <h1 class="Hero-name">Spider Kid</h1>
    <p class="Tag-line">Spider Kid, Spider Kid Best Saviour Of The World</p>
    <h2 class="label">Superpowers</h2>
    <ul class="Power">
        <li>Wall climbing</li>
        <li>Web shooting</li>
        <li>Super Strength</li>
        <li>Super sense</li>
        <li>Agility</li>
    </ul>
    <h2 class="label">Weakness</h2>
    <ul class="Weakness">
        <li>broccoli</li>
        <li>hindi</li>
        <li>homework</li>
        <li>losing</li>
        <li>others knowing who he is</li>
        <li>cat bite</li>
    </ul>
    <p class="badge">Top Spider</p>
    <p class="made-by">Created by Paarth Swarnakar</p>
</body>
</html>
